syntax = "proto3";

package project;

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {}
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {}
  rpc EditProject(EditProjectRequest) returns (EditProjectResponse) {}
}

message CreateProjectRequest {
  string slug = 1;
  string user_id = 2;
  string template_id = 3;
  optional string description = 4;
  ProjectVisibility visibility = 5;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string slug = 1;
  string user_id = 2;
}

message GetProjectResponse {
  Project project = 1;
}

message EditProjectRequest {
  string slug = 1;
  string user_id = 2;
  optional string description = 3;
  optional ProjectVisibility visibility = 4;
  optional string template_id = 5;
  optional string file_system_path = 6;
  optional ProjectStatus status = 7;
  optional string container_url = 8;
}

message EditProjectResponse {
  Project project = 1;
}

enum ProjectVisibility {
  PROJECT_VISIBILITY_UNSPECIFIED = 0;
  PROJECT_VISIBILITY_PUBLIC = 1;
  PROJECT_VISIBILITY_PRIVATE = 2;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_CREATED = 1;
  PROJECT_STATUS_RUNNING = 2;
  PROJECT_STATUS_PAUSED = 3;
  PROJECT_STATUS_RESTARTING = 4;
  PROJECT_STATUS_ERROR = 5;
  PROJECT_STATUS_REMOVING = 6;
  PROJECT_STATUS_EXITED = 7;
  PROJECT_STATUS_DEAD = 8;
}

message Project {
  string id = 1;
  string slug = 2;
  optional string description = 3;
  ProjectVisibility visibility = 4;
  string file_system_path = 5;
  ProjectStatus status = 6;
  string template_id = 7;
  string user_id = 8;
  optional string container_url = 9;
  string created_at = 10;
  string updated_at = 11;
}
