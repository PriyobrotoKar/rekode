syntax = "proto3";

package template;

service TemplateService {
    rpc GetAllTemplates(GetAllTemplatesRequest) returns (GetAllTemplatesResponse) {}
}

message GetAllTemplatesRequest {
    optional string language = 1;
    optional Environment environment = 2;
}

message GetAllTemplatesResponse {
    repeated Template templates = 1;
}

enum Environment {
    ENVIRONMENT_UNSPECIFIED = 0;
    ENVIRONMENT_BROWSER = 1;
    ENVIRONMENT_SERVER = 2;
}

message Template {
    string id = 1;
    string slug = 2;
    repeated string technologies = 3;
    string language = 4;
    Environment environment = 5;
    string repo_url = 7;
    optional string description = 8;
    string install_cmd = 9;
    string build_cmd = 10;
    string start_cmd = 11;
}
